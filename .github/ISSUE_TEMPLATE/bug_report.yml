name: 报告 Bug
description: 软件行为不符合预期
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: 软件版本, placeholder: 例如 1.1.101}
    validations: {required: true}
  - type: input
    id: system
    attributes: {label: 系统, placeholder: 例如 macOS 26 / Windows 11}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: 复现步骤, description: 做了什么、期望什么、实际发生了什么}
    validations: {required: true}
  - type: textarea
    id: extra
    attributes: {label: 其他信息, description: 截图、任务日志（不要包含不想公开的文件路径或内容）}
